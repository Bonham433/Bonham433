    <path d="M713 198h38m-38 12h27" stroke="#81a6a9" stroke-width="2" stroke-linecap="round"/>
    <path d="M868 103V89m-4 4 4-4 4 4m-4 10h22m-4-4 4 4-4 4" fill="none" stroke="#81a6a9"/>
    <circle cx="868" cy="103" r="2" fill="#75ffc1"/>
