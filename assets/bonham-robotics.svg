<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">BONHAM433 Robotics Lab</title>
  <desc id="desc">A dark robotics banner with a green camera frustum, coordinate axes and an overhead rover drawing.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b121a"/>
      <stop offset="1" stop-color="#111f24"/>
    </linearGradient>
    <linearGradient id="cone" x2="0" y2="1">
      <stop stop-color="#76ffc2" stop-opacity=".22"/>
      <stop offset="1" stop-color="#76ffc2" stop-opacity=".02"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#75a8a8" stroke-opacity=".16"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="958" height="338" rx="22"/></clipPath>
  </defs>
  <style>
    .scan { transform-origin: 732px 97px; animation: scan 4s ease-in-out infinite alternate; }
    @keyframes scan { 0%, 10% { transform: translateY(-23px) scaleX(1.35); opacity: .25; } 90%, 100% { transform: translateY(18px) scaleX(.60); opacity: .95; } }
    @media (prefers-reduced-motion: reduce) { .scan { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <path d="M0 0h960v340H0z" fill="url(#background)"/>
    <path d="M540 0h420v340H540z" fill="url(#grid)"/>
    <path d="M36 44h888M36 296h888M540 44v252" fill="none" stroke="#344b54"/>
    <path d="M36 64V44h20m848 0h20v20M36 276v20h20m848 0h20v-20" fill="none" stroke="#75ffc1" stroke-width="2"/>
    <g font-family="ui-monospace, Consolas, monospace">
      <text x="64" y="99" fill="#75ffc1" font-size="17" font-weight="700" letter-spacing="4">ROBOTICS LAB</text>
      <text x="61" y="174" fill="#f0fff9" font-size="67" font-weight="700" letter-spacing="-3">BONHAM433</text>
      <path d="M65 207h48" stroke="#75ffc1" stroke-width="3"/>
      <text x="64" y="240" fill="#c2d8db" font-size="17">Camera Geometry / Motion Control</text>
      <text x="64" y="266" fill="#c2d8db" font-size="17">Simulation / Visual Localization</text>
      <text x="862" y="82" fill="#a7c7c9" font-size="12">+X</text>
      <text x="896" y="107" fill="#a7c7c9" font-size="12">+Y</text>
    </g>
    <g fill="none" stroke="#45636b">
      <circle cx="732" cy="170" r="104"/>
      <circle cx="732" cy="170" r="81" stroke-dasharray="3 6"/>
      <path d="M591 170h282m-141-111v222" stroke-dasharray="3 6"/>
    </g>
    <path d="M732 147 634 67h196z" fill="url(#cone)" stroke="#75ffc1" stroke-opacity=".65"/>
    <path class="scan" d="M671 97h122" stroke="#75ffc1" stroke-width="2" stroke-linecap="round"/>
    <g fill="#101d24" stroke="#75ffc1" stroke-width="2">
      <rect x="688" y="132" width="88" height="108" rx="18"/>
      <rect x="677" y="149" width="17" height="30" rx="4"/>
      <rect x="770" y="149" width="17" height="30" rx="4"/>
